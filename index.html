<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Accessible Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Interactive Photo Gallery</h1>
        <h2>Hover or Tab through the images to view them</h2>
    </header>

    <main>
        <div id="image">
            Hover over an image below to display here.
        </div>

        <div class="gallery">
            <figure class="preview">
                <img src="https://picsum.photos/id/10/600/400" alt="Forest path surrounded by lush trees">
            </figure>
            <figure class="preview">
                <img src="https://picsum.photos/id/16/600/400" alt="Ocean view with dramatic sunset colors">
            </figure>
            <figure class="preview">
                <img src="https://picsum.photos/id/28/600/400" alt="Serene mountain lake reflecting clouds">
            </figure>
            <figure class="preview">
                <img src="https://picsum.photos/id/42/600/400" alt="Close up view of a coffee cup on table">
            </figure>
            <figure class="preview">
                <img src="https://picsum.photos/id/54/600/400" alt="Mountain peaks under clear blue sky">
            </figure>
            <figure class="preview">
                <img src="https://picsum.photos/id/60/600/400" alt="Desktop setup with laptop and accessories">
            </figure>
        </div>
    </main>

</body>
</html>
